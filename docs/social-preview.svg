  <circle cx="168" cy="99" r="4.5" fill="#4E9F72"/>
  <text x="182" y="104" font-size="13.5" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#E7E1D7">eatingDream-antigravity-plugins/mac-clamshell-mcp</text>

  <!-- Hero Title & Subtitle -->
  <text x="72" y="210" font-size="58" font-weight="700" font-family="Georgia,'New York',ui-serif,serif" fill="#F4F1EA" letter-spacing="-1.1">Mac Clamshell MCP</text>
  <text x="72" y="256" font-size="21" fill="#A39E93">Native Rust clamshell throttling, display thermal guard,</text>
  <text x="72" y="286" font-size="21" fill="#A39E93">and built-in brightness control for macOS.</text>

  <!-- 2x2 Feature Cards -->
  <rect x="72" y="324" width="286" height="66" rx="14" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="72" y="324" width="4.5" height="66" rx="2.25" fill="#D97757"/>
  <text x="92" y="352" font-size="15" font-weight="650" fill="#F4F1EA">CoreGraphics + DisplayServices</text>
  <text x="92" y="374" font-size="12.5" fill="#A39E93">Direct Rust dlopen FFI · Zero Node runtime</text>

  <rect x="374" y="324" width="286" height="66" rx="14" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="374" y="324" width="4.5" height="66" rx="2.25" fill="#4E9F72"/>
  <text x="394" y="352" font-size="15" font-weight="650" fill="#F4F1EA">Display Thermal Guard</text>
  <text x="394" y="374" font-size="12.5" fill="#A39E93">0% dim &amp; sleep closed · safe wake restore</text>

  <rect x="72" y="406" width="286" height="66" rx="14" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="72" y="406" width="4.5" height="66" rx="2.25" fill="#D4A14B"/>
  <text x="92" y="434" font-size="15" font-weight="650" fill="#F4F1EA">4-Tier Adaptive Policy</text>
  <text x="92" y="456" font-size="12.5" fill="#A39E93">Normal · Utility · Eco · Strict QoS caps</text>

  <rect x="374" y="406" width="286" height="66" rx="14" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="374" y="406" width="4.5" height="66" rx="2.25" fill="#D97757"/>
  <text x="394" y="434" font-size="15" font-weight="650" fill="#F4F1EA">&lt;0.5 ms SWR Dashboard</text>
  <text x="394" y="456" font-size="12.5" fill="#A39E93">SEP-1865 dark-first · &lt;38 KiB · ETag sync</text>

  <!-- CLI Pill -->
  <rect x="72" y="498" width="588" height="42" rx="11" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.10"/>
  <text x="92" y="524" font-size="13.5" font-family="ui-monospace,'SF Mono',Menlo,monospace">
    <tspan fill="#D97757" font-weight="700">$</tspan><tspan fill="#F4F1EA"> mac-clamshell-mcp run -- cargo build --release</tspan>
  </text>

  <!-- Footer -->
