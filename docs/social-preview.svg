<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,'SF Pro Display','SF Pro Text','PingFang SC',BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="t">Mac Clamshell MCP Social Preview</title>
  <desc id="d">Native Rust macOS clamshell performance throttling, display thermal guard, built-in brightness control, and zero-flicker SEP-1865 MCP dashboard.</desc>
  <defs>
    <radialGradient id="bgGlow1" cx="14%" cy="14%" r="58%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#141311" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="88%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#4E9F72" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#141311" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardWarm" cx="0%" cy="0%" r="72%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1A1916" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sliderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#E5896B"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="700" y="64" width="512" height="512" rx="22"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="640" fill="#141311"/>
