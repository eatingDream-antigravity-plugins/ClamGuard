<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="t d" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','SF Pro Text',BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="t">Mac Clamshell MCP 架构图</title>
  <desc id="d">macOS 硬件探针与原生 DisplayServices/CoreGraphics FFI 驱动 Rust 策略引擎与屏幕温控守护，向上暴露 CLI、生命周期 Hook、LaunchAgent 与零闪烁 SEP-1865 MCP 面板。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#D97757"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#78736A"/>
    </marker>
    <radialGradient id="glow" cx="12%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#141311" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1119" height="619" rx="20" fill="#141311" stroke="#FFF8EE" stroke-opacity="0.10"/>
  <rect x="1" y="1" width="1118" height="618" rx="19.5" fill="url(#glow)"/>

  <text x="560" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#F4F1EA">Mac Clamshell MCP · 原生 Rust 合盖控温与 MCP 架构</text>
  <text x="560" y="56" text-anchor="middle" font-size="12" fill="#A39E93">单一原生 macOS 二进制 · CoreGraphics &amp; DisplayServices 原生 FFI · 零闪烁 SEP-1865 面板</text>

  <!-- 第 1 列：macOS 硬件与原生 FFI -->
  <rect x="28" y="76" width="244" height="334" rx="15" fill="#1A1916" stroke="#D97757" stroke-opacity="0.35"/>
  <text x="150" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E5896B">1 · macOS 硬件与 FFI</text>

  <rect x="40" y="116" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="40" y="116" width="4.5" height="58" rx="2.25" fill="#D97757"/>
  <text x="55" y="140" font-size="13.5" font-weight="650" fill="#F4F1EA">合盖与电源探针</text>
  <text x="55" y="159" font-size="11.5" fill="#A39E93">IOKit 合盖状态 · pmset 电池/插电</text>

  <rect x="40" y="186" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="40" y="186" width="4.5" height="58" rx="2.25" fill="#D97757"/>
  <text x="55" y="210" font-size="13.5" font-weight="650" fill="#F4F1EA">温度压力检测</text>
  <text x="55" y="229" font-size="11.5" fill="#A39E93">pmset -g therm · 有界超时保护</text>

  <rect x="40" y="256" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="40" y="256" width="4.5" height="58" rx="2.25" fill="#D97757"/>
  <text x="55" y="280" font-size="13.5" font-weight="650" fill="#F4F1EA">显示器原生 FFI</text>
  <text x="55" y="299" font-size="11.5" fill="#A39E93">CoreGraphics · DisplayServices</text>

  <rect x="40" y="326" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="40" y="326" width="4.5" height="58" rx="2.25" fill="#D97757"/>
  <text x="55" y="350" font-size="13.5" font-weight="650" fill="#F4F1EA">CPU 与 Mach 遥测</text>
  <text x="55" y="369" font-size="11.5" fill="#A39E93">sysctl P/E 核拓扑 · Mach VM</text>

  <line x1="275" y1="243" x2="297" y2="243" stroke="#D97757" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 第 2 列：策略与守护核心 -->
  <rect x="302" y="76" width="244" height="334" rx="15" fill="#1A1916" stroke="#D4A14B" stroke-opacity="0.35"/>
  <text x="424" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E3B663">2 · 策略与温控核心</text>

  <rect x="314" y="116" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="314" y="116" width="4.5" height="58" rx="2.25" fill="#D4A14B"/>
  <text x="329" y="140" font-size="13.5" font-weight="650" fill="#F4F1EA">策略引擎 (policy.rs)</text>
  <text x="329" y="159" font-size="11.5" fill="#A39E93">正常 · 控温 · 节能 · 强限四档</text>

  <rect x="314" y="186" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="314" y="186" width="4.5" height="58" rx="2.25" fill="#D4A14B"/>
  <text x="329" y="210" font-size="13.5" font-weight="650" fill="#F4F1EA">屏幕守护 (guard.rs)</text>
  <text x="329" y="229" font-size="11.5" fill="#A39E93">合盖 0% 熄屏 · 开盖安全恢复亮度</text>

  <rect x="314" y="256" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="314" y="256" width="4.5" height="58" rx="2.25" fill="#D4A14B"/>
  <text x="329" y="280" font-size="13.5" font-weight="650" fill="#F4F1EA">状态存储 (state.rs)</text>
  <text x="329" y="299" font-size="11.5" fill="#A39E93">0600 原子写入 · O_NOFOLLOW 锁</text>

  <rect x="314" y="326" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="314" y="326" width="4.5" height="58" rx="2.25" fill="#D4A14B"/>
  <text x="329" y="350" font-size="13.5" font-weight="650" fill="#F4F1EA">命令包装 (runner.rs)</text>
  <text x="329" y="369" font-size="11.5" fill="#A39E93">taskpolicy · nice · 10 项并发变量</text>

  <line x1="549" y1="243" x2="571" y2="243" stroke="#D97757" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 第 3 列：运行时入口 -->
  <rect x="576" y="76" width="244" height="334" rx="15" fill="#1A1916" stroke="#4E9F72" stroke-opacity="0.35"/>
  <text x="698" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6BBF8E">3 · 运行时入口</text>

  <rect x="588" y="116" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="588" y="116" width="4.5" height="58" rx="2.25" fill="#4E9F72"/>
  <text x="603" y="140" font-size="13.5" font-weight="650" fill="#F4F1EA">MCP Stdio 服务</text>
  <text x="603" y="159" font-size="11.5" fill="#A39E93">启动预热 + SWR · &lt;0.5 ms 直出</text>

  <rect x="588" y="186" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="588" y="186" width="4.5" height="58" rx="2.25" fill="#4E9F72"/>
  <text x="603" y="210" font-size="13.5" font-weight="650" fill="#F4F1EA">生命周期 Hook</text>
  <text x="603" y="229" font-size="11.5" fill="#A39E93">~1–3 ms · normal 档静默返回 {}</text>

  <rect x="588" y="256" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="588" y="256" width="4.5" height="58" rx="2.25" fill="#4E9F72"/>
  <text x="603" y="280" font-size="13.5" font-weight="650" fill="#F4F1EA">后台守护 (watch)</text>
  <text x="603" y="299" font-size="11.5" fill="#A39E93">LaunchAgent · 唤醒竞态重试</text>

  <rect x="588" y="326" width="220" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="588" y="326" width="4.5" height="58" rx="2.25" fill="#4E9F72"/>
  <text x="603" y="350" font-size="13.5" font-weight="650" fill="#F4F1EA">原生命令行</text>
  <text x="603" y="369" font-size="11.5" fill="#A39E93">status · run · brightness · watch</text>

  <line x1="823" y1="243" x2="845" y2="243" stroke="#D97757" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 第 4 列：Agent 与仪表盘 -->
  <rect x="850" y="76" width="242" height="334" rx="15" fill="#1A1916" stroke="#D97757" stroke-opacity="0.45"/>
  <text x="971" y="102" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E5896B">4 · Agent 与仪表盘</text>

  <rect x="862" y="116" width="218" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="862" y="116" width="4.5" height="58" rx="2.25" fill="#D97757"/>
  <text x="877" y="140" font-size="13.5" font-weight="650" fill="#F4F1EA">SEP-1865 单文件面板</text>
  <text x="877" y="159" font-size="11.5" fill="#A39E93">&lt;38 KiB · 深色首帧 · 防透明白屏</text>

  <rect x="862" y="186" width="218" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="862" y="186" width="4.5" height="58" rx="2.25" fill="#D97757"/>
  <text x="877" y="210" font-size="13.5" font-weight="650" fill="#F4F1EA">弱网低带宽同步</text>
  <text x="877" y="229" font-size="11.5" fill="#A39E93">SHA-256 ETag 去重 · RTT 自适应</text>

  <rect x="862" y="256" width="218" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="862" y="256" width="4.5" height="58" rx="2.25" fill="#D97757"/>
  <text x="877" y="280" font-size="13.5" font-weight="650" fill="#F4F1EA">低侵入渐进披露</text>
  <text x="877" y="299" font-size="11.5" fill="#A39E93">AGENTS.md &lt;400 B · 按需 SKILL</text>

  <rect x="862" y="326" width="218" height="58" rx="10" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <rect x="862" y="326" width="4.5" height="58" rx="2.25" fill="#D97757"/>
  <text x="877" y="350" font-size="13.5" font-weight="650" fill="#F4F1EA">MCP 工具可见性分层</text>
  <text x="877" y="369" font-size="11.5" fill="#A39E93">2 个模型可见 · 2 个仅面板可见</text>

  <!-- 底部左侧：四档策略矩阵 -->
  <rect x="28" y="438" width="680" height="154" rx="14" fill="#181714" stroke="#FFF8EE" stroke-opacity="0.14" stroke-dasharray="5 4"/>
  <text x="44" y="462" font-size="12.5" font-weight="700" fill="#F4F1EA">自适应策略四档矩阵 · 实时硬件状态 → 调度优先级与并发上限</text>

  <rect x="44" y="476" width="154" height="100" rx="10" fill="#1C1B18" stroke="#4E9F72" stroke-opacity="0.45"/>
  <text x="58" y="498" font-size="13" font-weight="700" fill="#4E9F72">Normal 正常</text>
  <text x="58" y="517" font-size="11" fill="#F4F1EA">开盖且温度正常</text>
  <text x="58" y="537" font-size="10.5" fill="#A39E93">不施加额外限流</text>
  <text x="58" y="555" font-size="10.5" fill="#A39E93">释放全部逻辑核心</text>

  <rect x="209" y="476" width="154" height="100" rx="10" fill="#1C1B18" stroke="#D4A14B" stroke-opacity="0.45"/>
  <text x="223" y="498" font-size="13" font-weight="700" fill="#D4A14B">Utility 控温</text>
  <text x="223" y="517" font-size="11" fill="#F4F1EA">合盖 + 插电</text>
  <text x="223" y="537" font-size="10.5" fill="#A39E93">taskpolicy -c utility</text>
  <text x="223" y="555" font-size="10.5" fill="#A39E93">nice 10 · E 核 2..4</text>

  <rect x="374" y="476" width="154" height="100" rx="10" fill="#1C1B18" stroke="#D97757" stroke-opacity="0.50"/>
  <text x="388" y="498" font-size="13" font-weight="700" fill="#D97757">Eco 节能</text>
  <text x="388" y="517" font-size="11" fill="#F4F1EA">合盖 + 电池供电</text>
  <text x="388" y="537" font-size="10.5" fill="#A39E93">taskpolicy -c background</text>
  <text x="388" y="555" font-size="10.5" fill="#A39E93">nice 15 · ≤2（低电 1）</text>

  <rect x="539" y="476" width="154" height="100" rx="10" fill="#1C1B18" stroke="#D95F59" stroke-opacity="0.50"/>
  <text x="553" y="498" font-size="13" font-weight="700" fill="#D95F59">Strict 强限</text>
  <text x="553" y="517" font-size="11" fill="#F4F1EA">检测到温控告警</text>
  <text x="553" y="537" font-size="10.5" fill="#A39E93">taskpolicy -b（限 I/O）</text>
  <text x="553" y="555" font-size="10.5" fill="#A39E93">nice 19 · 单并发保护</text>

  <!-- 底部右侧：安全边界与自动发布 -->
  <rect x="728" y="438" width="364" height="154" rx="14" fill="#181714" stroke="#FFF8EE" stroke-opacity="0.14" stroke-dasharray="5 4"/>
  <text x="744" y="462" font-size="12.5" font-weight="700" fill="#F4F1EA">安全边界与自动化发布 CI</text>

  <rect x="744" y="476" width="332" height="44" rx="9" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <text x="758" y="495" font-size="12" font-weight="650" fill="#F4F1EA">纯本地运行 · 运行时零外网请求</text>
  <text x="758" y="511" font-size="10.5" fill="#A39E93">0700 私有目录 · 0600 原子状态 · default-src 'none'</text>

  <rect x="744" y="532" width="332" height="44" rx="9" fill="#1C1B18" stroke="#FFF8EE" stroke-opacity="0.09"/>
  <text x="758" y="551" font-size="12" font-weight="650" fill="#F4F1EA">GitHub Actions · Release Please + macOS 打包</text>
  <text x="758" y="567" font-size="10.5" fill="#A39E93">arm64 &amp; x86_64 · 路径脱敏 Rust · SHA-256 · gitleaks</text>

