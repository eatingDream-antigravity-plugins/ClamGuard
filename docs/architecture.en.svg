  <text x="44" y="462" font-size="12.5" font-weight="700" fill="#F2F4F8">Adaptive Policy Tier Matrix · Live Hardware → Scheduler &amp; Concurrency Caps</text>

  <rect x="44" y="476" width="154" height="100" rx="10" fill="#181C28" stroke="#34D399" stroke-opacity="0.45"/>
  <text x="58" y="498" font-size="13" font-weight="700" fill="#34D399">Normal</text>
  <text x="58" y="517" font-size="11" fill="#F2F4F8">Lid open · therm OK</text>
  <text x="58" y="537" font-size="10.5" fill="#A6B0C3">Unrestricted QoS</text>
  <text x="58" y="555" font-size="10.5" fill="#A6B0C3">All logical cores</text>

  <rect x="209" y="476" width="154" height="100" rx="10" fill="#181C28" stroke="#FBBF24" stroke-opacity="0.45"/>
  <text x="223" y="498" font-size="13" font-weight="700" fill="#FBBF24">Cool</text>
  <text x="223" y="517" font-size="11" fill="#F2F4F8">Lid closed + AC</text>
  <text x="223" y="537" font-size="10.5" fill="#A6B0C3">taskpolicy -c utility</text>
  <text x="223" y="555" font-size="10.5" fill="#A6B0C3">nice 10 · E-cores 2..4</text>

  <rect x="374" y="476" width="154" height="100" rx="10" fill="#181C28" stroke="#6895FF" stroke-opacity="0.50"/>
  <text x="388" y="498" font-size="13" font-weight="700" fill="#6895FF">Eco</text>
  <text x="388" y="517" font-size="11" fill="#F2F4F8">Lid closed + Battery</text>
  <text x="388" y="537" font-size="10.5" fill="#A6B0C3">taskpolicy -c background</text>
  <text x="388" y="555" font-size="10.5" fill="#A6B0C3">nice 15 · ≤2 (1 if ≤20%)</text>

  <rect x="539" y="476" width="154" height="100" rx="10" fill="#181C28" stroke="#F87171" stroke-opacity="0.50"/>
  <text x="553" y="498" font-size="13" font-weight="700" fill="#F87171">Strict</text>
  <text x="553" y="517" font-size="11" fill="#F2F4F8">Thermal warning</text>
  <text x="553" y="537" font-size="10.5" fill="#A6B0C3">taskpolicy -b (I/O cap)</text>
  <text x="553" y="555" font-size="10.5" fill="#A6B0C3">nice 19 · max_jobs = 1</text>

