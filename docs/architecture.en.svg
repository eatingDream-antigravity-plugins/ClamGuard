  <text x="329" y="229" font-size="11.5" fill="#A6B0C3">0% dim + sleep · wake-restore sync</text>

  <rect x="314" y="256" width="220" height="58" rx="10" fill="#181C28" stroke="#F2F4F8" stroke-opacity="0.09"/>
