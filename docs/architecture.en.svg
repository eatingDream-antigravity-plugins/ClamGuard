  <text x="388" y="537" font-size="10.5" fill="#A39E93">taskpolicy -c background</text>
  <text x="388" y="555" font-size="10.5" fill="#A39E93">nice 15 · ≤2 (1 if ≤20%)</text>

  <rect x="539" y="476" width="154" height="100" rx="10" fill="#1C1B18" stroke="#D95F59" stroke-opacity="0.50"/>
  <text x="553" y="498" font-size="13" font-weight="700" fill="#D95F59">Strict</text>
