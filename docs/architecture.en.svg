  <text x="55" y="229" font-size="11.5" fill="#A6B0C3">pmset -g therm · bounded timeout</text>

  <rect x="40" y="256" width="220" height="58" rx="10" fill="#181C28" stroke="#F2F4F8" stroke-opacity="0.09"/>
  <rect x="40" y="256" width="4.5" height="58" rx="2.25" fill="#6895FF"/>
