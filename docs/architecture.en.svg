<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="t d" font-family="-apple-system,'SF Pro Text','PingFang SC','Noto Sans CJK SC',BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="t">Clam Guard Architecture</title>
  <desc id="d">macOS hardware probes and native DisplayServices/CoreGraphics FFI feed the Rust policy and display thermal guard engine, exposing CLI, hooks, LaunchAgent daemon, and a low-bandwidth SEP-1865 MCP Apps dashboard.</desc>
