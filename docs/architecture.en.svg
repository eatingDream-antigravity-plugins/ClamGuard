  <text x="58" y="537" font-size="10.5" fill="#A39E93">Unrestricted QoS</text>
  <text x="58" y="555" font-size="10.5" fill="#A39E93">All logical cores</text>

  <rect x="209" y="476" width="154" height="100" rx="10" fill="#1C1B18" stroke="#D4A14B" stroke-opacity="0.45"/>
