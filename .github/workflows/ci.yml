name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-and-panel:
    name: Rust + Panel tests (macOS)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Cargo fmt check
        run: cargo fmt --check
      - name: Cargo clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features test-mocks -- -D warnings
      - name: Cargo test
        run: |
          cargo test --locked
          cargo test --locked --features test-mocks
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Panel build drift & tests
        run: |
          (cd panel && npm ci --ignore-scripts)
          npm --prefix panel run typecheck
          npm --prefix panel run build
          git diff --exit-code -- panel/dist/panel.html
          npm --prefix panel test
          sh -n scripts/install.sh scripts/install-plugin.sh scripts/install-launchagent.sh
          bash -n scripts/*.sh

  secrets-scan:
    name: Secret scan (gitleaks) + sanitization guard
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned binary, SHA-256 verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tgz" "$base/$tgz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tgz" | sha256sum -c -
          tar xzf "$tgz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (full history)
        run: gitleaks detect --source . --redact --no-banner --verbose
      - name: Sanitization guard
        run: bash scripts/check_sanitized.sh
