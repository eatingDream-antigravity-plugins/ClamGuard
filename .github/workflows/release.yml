name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and attach release assets for (e.g. v1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build and attach release assets for"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ensure-release:
    name: Validate tag & ensure GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "error: invalid release tag '$TAG' (expected vX.Y.Z)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Sanitization guard
        run: bash scripts/check_sanitized.sh
      - name: Ensure release exists
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            ver="${TAG#v}"
            awk -v v="$ver" '/^###? / { p = index($0, "[" v "]") > 0 || index($0, " " v " ") > 0; next } /^\[[^]]*\]: / { next } p' CHANGELOG.md > release-notes.md
            if [ -s release-notes.md ]; then
              notes=(--notes-file release-notes.md)
            else
              notes=(--generate-notes)
            fi
            extra=()
            if [[ "$TAG" == *-* ]]; then extra=(--prerelease); fi
            gh release create "$TAG" --title "$TAG" "${extra[@]}" "${notes[@]}"
          fi

  package-macos:
    name: Build & upload plugin tarball (${{ matrix.target }})
    needs: ensure-release
    runs-on: macos-14
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Install Rust target
        run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build & test panel HTML
        run: |
          (cd panel && npm install --no-audit --no-fund)
          node panel/pack.mjs
          node --test panel/test/panel.test.mjs
      - name: Run Rust tests (native host)
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --locked
      - name: Build stripped, path-remapped release binary
        run: |
          RUSTFLAGS="--remap-path-prefix=$HOME=/build" cargo build --release --locked --target "$TARGET"
      - name: Package Antigravity plugin tarball & SHA-256
        run: |
          ARCHIVE="mac-clamshell-mcp-${TAG}-${TARGET}.tar.gz"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/bin" "$STAGE/panel/dist" "$STAGE/rules" "$STAGE/skills/mac-clamshell" "$STAGE/assets"
          install -m 0755 "target/${TARGET}/release/mac-clamshell-mcp" "$STAGE/bin/mac-clamshell-mcp"
          cp panel/dist/panel.html "$STAGE/panel/dist/panel.html"
          cp plugin/plugin.json "$STAGE/plugin.json"
          cp plugin/mcp_config.json "$STAGE/mcp_config.json"
          cp plugin/hooks.json "$STAGE/hooks.json"
          cp plugin/rules/AGENTS.md "$STAGE/rules/AGENTS.md"
          cp plugin/skills/mac-clamshell/SKILL.md "$STAGE/skills/mac-clamshell/SKILL.md"
          cp assets/logo.svg "$STAGE/assets/logo.svg"
          cp LICENSE "$STAGE/LICENSE"
          cp README.md "$STAGE/README.md"
          COPYFILE_DISABLE=1 tar -czf "$ARCHIVE" -C "$STAGE" .
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          rm -rf "$STAGE"
      - name: Upload assets to GitHub Release
        run: |
          ARCHIVE="mac-clamshell-mcp-${TAG}-${TARGET}.tar.gz"
          gh release upload "$TAG" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber
